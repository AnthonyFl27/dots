# main config helix editor

# theme 
theme = "base16_default_dark"

[editor]
true-color = true
line-number = "relative"
mouse = true
bufferline = "always"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.insert]
esc = ["collapse_selection", "normal_mode"]

[keys.normal.space]
q = ":quit!"  # exit
w = ":write"  # save 
v = ":vsplit" #split vertical
h = ":hsplit" #split horizontal
e = "file_explorer" # file explorer 
