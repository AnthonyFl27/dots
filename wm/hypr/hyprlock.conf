general {
    grace = 0
    max_failed_attempts = 5
    failed_attempts_timeout = 300
}

background {
    monitor =
    path = /home/anthony/Imágenes/walls/02-mr-robot.png
    blur_passes = 2
    blur_size = 5
    contrast = 0.9
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = monospace
    color = rgba(255, 255, 255, 1.0)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %d de %B"
    font_size = 24
    font_family = monospace
    color = rgba(255, 255, 255, 0.8)
