$mainMod = SUPER
$terminal = alacritty
$fileManager = dolphin
$menu = wofi

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
# bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, Space, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, Q, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Layout modes
bind = $mainMod SHIFT, D, exec, hyprctl keyword general:layout dwindle
bind = $mainMod SHIFT, M, exec, hyprctl keyword general:layout master
bind = $mainMod SHIFT, S, exec, hyprctl keyword general:layout scrolling
bind = $mainMod SHIFT, C, exec, hyprctl keyword general:layout monocle
bind = $mainMod, H, layoutmsg, removemaster
bind = $mainMod, L, layoutmsg, addmaster

# Window navigation (Dwindle, Master, Scrolling, Monocle)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, layoutmsg, cycleprev
bind = $mainMod, down, layoutmsg, cyclenext
bind = $mainMod CTRL, left, layoutmsg, colresize -0.05
bind = $mainMod CTRL, right, layoutmsg, colresize +0.05
bind = $mainMod CTRL, P, layoutmsg, promote
bind = $mainMod CTRL, O, layoutmsg, consume_or_expel next

bind = $mainMod SHIFT, L, exec, hyprlock

scrolling {
    column_width = 0.5
    direction = right
}

general {
    gaps_in = 2
    gaps_out = 5
    col.active_border = rgb(151515)
    col.inactive_border = rgb(151515)
}

# Volume control
bind = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ,XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness control
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl set 5%+

exec-once = swaybg -i /home/anthony/Imágenes/walls/02-mr-robot.png
exec-once = waybar

monitor = ,preferred,auto,1

input {
    kb_layout = latam
}
